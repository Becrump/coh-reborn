; CoH Reborn graphics presets (docs/performance.md). Only the lines that differ from
; Unreal's BaseScalability.ini are here; each level inherits everything else.
; Levels: 0 Low, 1 Medium, 2 High, 3 Epic, 4 Cinematic. The F10 screen and first-run
; auto-detect (CoHPerformance.cpp) pick the level; lamps, tree distance and city life
; follow it in code.
;
; The big costs in this city are Lumen (lighting), Virtual Shadow Maps, hardware
; ray tracing and 3,000+ street lamp lights. Low and Medium switch the first three
; off; only Cinematic keeps hardware ray tracing (it overran Robert's 8 GB card).

[GlobalIlluminationQuality@0]
r.Lumen.DiffuseIndirect.Allow=0
r.DistanceFieldAO=0
r.RayTracing.Enable=0

[GlobalIlluminationQuality@1]
r.Lumen.DiffuseIndirect.Allow=0
r.DistanceFieldAO=1
r.RayTracing.Enable=0

[GlobalIlluminationQuality@2]
; software Lumen: no ray tracing scene in video memory
r.Lumen.HardwareRayTracing=0
r.RayTracing.Enable=0

[GlobalIlluminationQuality@3]
r.Lumen.HardwareRayTracing=0
r.RayTracing.Enable=0

[GlobalIlluminationQuality@4]
r.Lumen.HardwareRayTracing=1
r.RayTracing.Enable=1

[ReflectionQuality@0]
r.Lumen.Reflections.Allow=0
r.SSR.Quality=0

[ReflectionQuality@1]
r.Lumen.Reflections.Allow=0
r.SSR.Quality=2

[ShadowQuality@0]
; classic cascaded shadow maps instead of Virtual Shadow Maps
r.Shadow.Virtual.Enable=0
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxCSMResolution=1024
r.Shadow.RadiusThreshold=0.06
r.Shadow.DistanceScale=0.6

[ShadowQuality@1]
r.Shadow.Virtual.Enable=0
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxCSMResolution=2048
r.Shadow.RadiusThreshold=0.04
r.Shadow.DistanceScale=0.85

[ShadowQuality@2]
r.Shadow.Virtual.Enable=1

[ShadowQuality@3]
r.Shadow.Virtual.Enable=1

[ViewDistanceQuality@0]
; fewer Nanite triangles (2-4 pixels per edge instead of 1)
r.Nanite.MaxPixelsPerEdge=4
r.LightMaxDrawDistanceScale=0.5

[ViewDistanceQuality@1]
r.Nanite.MaxPixelsPerEdge=2
r.LightMaxDrawDistanceScale=0.75

[ViewDistanceQuality@2]
r.Nanite.MaxPixelsPerEdge=1
r.LightMaxDrawDistanceScale=1

[ViewDistanceQuality@3]
r.Nanite.MaxPixelsPerEdge=1
r.LightMaxDrawDistanceScale=1

[TextureQuality@0]
; for 2-4 GB cards: smaller texture pools (City Sample streams virtual textures)
r.Streaming.PoolSize=600
r.VT.PoolSizeScale=0.5

[TextureQuality@1]
r.Streaming.PoolSize=1000
r.VT.PoolSizeScale=0.75

[TextureQuality@2]
; the 8 GB preset
r.Streaming.PoolSize=1500
r.VT.PoolSizeScale=1

[TextureQuality@3]
r.Streaming.PoolSize=2000
r.VT.PoolSizeScale=1
